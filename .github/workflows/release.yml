name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the upstream package version
        run: |
          version=$(dpkg-parsechangelog --show-field Version)
          test "v$version" = "$GITHUB_REF_NAME"
          build-aux/release-notes.sh "$version" > /dev/null

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Publish the tested DEB and RPM packages together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build-aux/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum -- *.deb *.rpm > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" \
            --title "NetworkManager-vless ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" *.deb *.rpm SHA256SUMS
